services:
  # -------------------------------------------------------
  # MySQL 8.0 Database
  # -------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: especa-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-especa_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-especa}
      MYSQL_USER: ${MYSQL_USER:-especa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-especa}
    volumes:
      - ./docker/volumes/mysql/initdb:/docker-entrypoint-initdb.d:ro
      - especa-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-especa_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.25"
          memory: 256M

  # -------------------------------------------------------
  # phpMyAdmin (Web UI Dashboard)
  # Exposed globally on port 8085
  # -------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: especa-phpmyadmin
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-especa}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-especa}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

volumes:
  especa-mysql-data:
